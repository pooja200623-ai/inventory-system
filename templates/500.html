{% extends "base.html" %}

{% block title %}Server Error (500){% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7 col-lg-5 text-center">
        <div class="mb-4">
            <span class="display-1 fw-bold text-danger">500</span>
            <div class="mt-2 text-danger">
                <i class="bi bi-exclamation-triangle-fill fs-1"></i>
            </div>
        </div>
        <h3 class="fw-bold mb-2">Internal Server Error</h3>
        <p class="text-muted mb-4">
            An unexpected error occurred while processing your request. Our system team has been notified.
        </p>
        <div class="d-flex justify-content-center gap-2">
            <a href="{% url 'dashboard' %}" class="btn btn-primary px-4">
                <i class="bi bi-speedometer2 me-1"></i> Return to Dashboard
            </a>
            <a href="javascript:location.reload()" class="btn btn-outline-secondary px-3">
                <i class="bi bi-arrow-clockwise me-1"></i> Retry
            </a>
        </div>
    </div>
</div>
{% endblock %}
