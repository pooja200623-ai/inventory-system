{% extends "base.html" %}

{% block title %}Page Not Found (404){% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7 col-lg-5 text-center">
        <div class="mb-4">
            <span class="display-1 fw-bold text-primary">404</span>
            <div class="mt-2 text-secondary">
                <i class="bi bi-compass fs-1 text-muted"></i>
            </div>
        </div>
        <h3 class="fw-bold mb-2">Page Not Found</h3>
        <p class="text-muted mb-4">
            The page you are looking for does not exist, has been removed, or is temporarily unavailable.
        </p>
        <div class="d-flex justify-content-center gap-2">
            <a href="{% url 'dashboard' %}" class="btn btn-primary px-4">
                <i class="bi bi-speedometer2 me-1"></i> Return to Dashboard
            </a>
            <a href="javascript:history.back()" class="btn btn-outline-secondary px-3">
                <i class="bi bi-arrow-left me-1"></i> Go Back
            </a>
        </div>
    </div>
</div>
{% endblock %}
